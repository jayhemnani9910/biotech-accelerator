[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biotech-accelerator"
dynamic = ["version"]
description = "Multi-agent AI system for biotech research that reads literature AND runs computational analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jay Hemnani" }
]
keywords = ["biotech", "AI", "multi-agent", "protein", "research", "langgraph"]

# Only what the package actually imports. numpy, scipy and biopython also arrive
# via prody, and pydantic via mcp; numpy is listed because the code imports it
# directly. Anything ML-flavoured (torch, torch-geometric, rdkit) was declared
# but never imported — it added ~3.8 GB to every install for nothing.
dependencies = [
    # Workflow orchestration
    "langgraph>=0.2.0",

    # MCP server (consumed by Claude Code and other MCP clients).
    # 2.x only: the server class moved from mcp.server.fastmcp.FastMCP to
    # mcp.server.mcpserver.MCPServer, and call_tool returns a CallToolResult
    # rather than a bare content sequence.
    "mcp>=2.0.0,<3.0.0",

    # Molecular biology — ANM/GNM normal mode analysis
    "prody>=2.0",

    # Scientific computing
    "numpy>=1.21.0",

    # HTTP/API
    "httpx>=0.24.0",

    # Hardened XML parsing for PubMed efetch responses (pure Python, no deps).
    # stdlib ElementTree expands internal entities, and that parse runs on bytes
    # taken straight off the network.
    "defusedxml>=0.7.1",

    # Terminal output
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.10.0",
]

[project.scripts]
biotech = "biotech_accelerator.main:main"
biotech-mcp = "biotech_accelerator.mcp_server:main"

[tool.hatch.version]
path = "biotech_accelerator/version.py"

[tool.hatch.build.targets.wheel]
packages = ["biotech_accelerator"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit live external APIs (PubMed, PDB, UniProt, ChEMBL)",
]

[tool.mypy]
# No python_version pin: mypy infers it from each CI matrix runtime. Pinning to
# 3.10 made mypy parse numpy's 3.12 stubs (PEP 695 `type` aliases) under 3.10
# rules, failing the 3.12 job; the 3.10 matrix job still covers the min version.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["biotech_accelerator"]

[[tool.mypy.overrides]]
module = ["biotech_accelerator.graph.*"]
# LangGraph node callables are registered against a TypedDict state but declared
# as taking plain dicts, which mypy reports at each add_node call. Scoped to the
# graph module only: the same override used to cover agents.nodes.* as well,
# where it hid a real defect (a None assigned to a non-Optional field).
disable_error_code = ["arg-type"]
